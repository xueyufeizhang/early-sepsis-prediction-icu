[project]
name = "sepsis-prediction"
version = "0.1.0"
description = "Early sepsis prediction in ICU patients (MIMIC-IV / eICU / MIMIC-III) — AI in Medicine course project, PoliTo"
readme = "README.md"
requires-python = ">=3.11,<3.13"

# Local-dev dependency source of truth. Mirrors requirements.txt (kept for
# Kaggle/Colab, which use pip). Lower-bound (>=) pins so resolution stays
# compatible with the managed notebook environments. See brief Section 12.
dependencies = [
    # --- Core data stack ---
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",            # statistical tests: Wilcoxon, paired t-test, DeLong helper
    # --- Classic ML ---
    "scikit-learn>=1.4",      # LR, SVM, RandomForest, MLP, metrics, GroupKFold
    "xgboost>=2.0",           # strong tabular baseline (reference paper)
    "imbalanced-learn>=0.12", # SMOTE (train fold only)
    # --- Deep learning (LSTM + MLP) ---
    "torch>=2.2",             # CPU wheels locally; real GPU training on Kaggle
    # --- Interpretability ---
    "shap>=0.44",
    # --- Plots ---
    "matplotlib>=3.8",
    "seaborn>=0.13",
    # --- Data access (PhysioNet via BigQuery, brief Section 3) ---
    "google-cloud-bigquery>=3.17",
    "db-dtypes>=1.2",         # BigQuery -> pandas dtype support
    "pyarrow>=14.0",          # parquet I/O for intermediate cohort/feature tables
    # --- Utilities ---
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

# Tooling / notebooks — installed locally, not needed on Kaggle (preinstalled).
# Install with: uv sync   (groups in [dependency-groups] are synced by default)
[dependency-groups]
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "ruff>=0.6",
]

[tool.uv]
# Research project: src/ modules are imported via path from notebooks (and on
# Kaggle), not built as an installable wheel. Application mode = manage the
# environment + lockfile without packaging this project.
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
